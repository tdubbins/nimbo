<!doctype html>
<html lang="en" data-tod="morning">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3d8fd9">
<title>Nimbo</title>
<style>
  @property --s1 { syntax: '<color>'; inherits: true; initial-value: #3d8fd9; }
  @property --s2 { syntax: '<color>'; inherits: true; initial-value: #8fd0f5; }
  @property --s3 { syntax: '<color>'; inherits: true; initial-value: #dff3ff; }
  :root {
    --s1: #3d8fd9; --s2: #8fd0f5; --s3: #dff3ff; --cloud: #ffffff; --cloud-o: .9;
    --glass: rgba(10, 28, 66, .38); --glass-strong: rgba(10, 24, 58, .6);
    --line: rgba(255,255,255,.22); --text: #ffffff; --muted: #dbe8ff; --accent: #ffd54f; --accent-ink: #3a2c00;
    --c-neg: #3f51b5; --c-zero: #29b6f6; --c-low: #43a047; --c-mid: #fbc02d; --c-high: #e53935;
    --base: min(calc((100vw - 60px) / 4), calc((100dvh - 250px) / 7.8), 92px);
    font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
    transition: --s1 3s ease, --s2 3s ease, --s3 3s ease;
  }
  :root[data-tod="dawn"]    { --s1: #6d8fd6; --s2: #f4a9a0; --s3: #ffd9a6; --cloud: #fff1ea; --cloud-o: .85; }
  :root[data-tod="morning"] { --s1: #3d8fd9; --s2: #8fd0f5; --s3: #dff3ff; --cloud: #ffffff; --cloud-o: .9; }
  :root[data-tod="noon"]    { --s1: #1565c0; --s2: #42a5f5; --s3: #b3e0ff; --cloud: #ffffff; --cloud-o: .95; }
  :root[data-tod="sunset"]  { --s1: #34295f; --s2: #b34f7a; --s3: #f7a35c; --cloud: #ffc9b0; --cloud-o: .7; }
  :root[data-tod="night"]   { --s1: #050920; --s2: #111b45; --s3: #27366b; --cloud: #8090c0; --cloud-o: .22; }
  @media (min-width: 900px) {
    :root { --base: min(calc((100vw - 400px) / 4), calc((100dvh - 250px) / 7.8), 100px); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--s2); color: var(--text); overflow: hidden;
    -webkit-tap-highlight-color: transparent; user-select: none; -webkit-user-select: none;
  }
  button { font: inherit; color: inherit; cursor: pointer; }
  input { font: inherit; }
  .hidden { display: none !important; }

  /* ---------- sky ---------- */
  #sky { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none;
    background: linear-gradient(180deg, var(--s1) 0%, var(--s2) 55%, var(--s3) 100%); }
  #stars { position: absolute; inset: 0; opacity: 0; transition: opacity 3s;
    background-image:
      radial-gradient(1.6px 1.6px at 20px 30px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 90px 80px, #fff, transparent),
      radial-gradient(1.8px 1.8px at 160px 20px, #fff, transparent),
      radial-gradient(1px 1px at 130px 150px, #fff, transparent),
      radial-gradient(1.4px 1.4px at 40px 170px, #fff, transparent),
      radial-gradient(1px 1px at 200px 120px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 70px 110px, #fff, transparent);
    background-size: 230px 200px; animation: twinkle 4s ease-in-out infinite alternate; }
  @keyframes twinkle { to { filter: brightness(.6); } }
  :root[data-tod="night"] #stars { opacity: 1; }
  :root[data-tod="sunset"] #stars { opacity: .25; }
  #sun { position: absolute; width: 110px; height: 110px; border-radius: 50%; left: 18%; top: 14%;
    background: radial-gradient(circle, #fffbe6 0 45%, #ffe082 70%, #ffca28);
    box-shadow: 0 0 60px 20px rgba(255, 224, 130, .55);
    transition: left 3s ease, top 3s ease, background 3s, box-shadow 3s; }
  :root[data-tod="dawn"] #sun { left: 8%; top: 62%; background: radial-gradient(circle, #fff3e0 0 40%, #ffb74d 75%, #ff8a65);
    box-shadow: 0 0 70px 30px rgba(255, 167, 112, .5); }
  :root[data-tod="noon"] #sun { left: 72%; top: 4%; }
  :root[data-tod="sunset"] #sun { left: 80%; top: 64%; background: radial-gradient(circle, #ffe0b2 0 35%, #ff8a65 70%, #f4511e);
    box-shadow: 0 0 90px 40px rgba(255, 112, 67, .45); }
  :root[data-tod="night"] #sun { left: 76%; top: 8%; width: 80px; height: 80px;
    background: radial-gradient(circle at 35% 35%, #fffde7, #e8e4c0 60%, #cfc9a0);
    box-shadow: 0 0 40px 8px rgba(255, 253, 231, .25); }
  .cloud { position: absolute; left: 0; width: 170px; height: 56px; border-radius: 56px; background: var(--cloud);
    opacity: var(--cloud-o); animation: drift linear infinite; transition: opacity 3s, background 3s; }
  .cloud::before, .cloud::after { content: ""; position: absolute; background: inherit; border-radius: 50%; }
  .cloud::before { width: 84px; height: 84px; top: -42px; left: 24px; }
  .cloud::after { width: 64px; height: 64px; top: -28px; right: 22px; }
  .cloud.c1 { top: 8%;  transform: scale(1);   animation-duration: 95s;  animation-delay: -20s; }
  .cloud.c2 { top: 30%; animation-duration: 130s; animation-delay: -80s; scale: .7; }
  .cloud.c3 { top: 55%; animation-duration: 110s; animation-delay: -50s; scale: 1.2; }
  .cloud.c4 { top: 78%; animation-duration: 150s; animation-delay: -120s; scale: .9; }
  .cloud.c5 { top: 18%; animation-duration: 170s; animation-delay: -10s; scale: .55; }
  @keyframes drift { from { translate: -260px 0; } to { translate: calc(100vw + 260px) 0; } }
  @media (prefers-reduced-motion: reduce) { .cloud, #stars { animation: none; } }

  #start, #game { position: relative; z-index: 1; }
  .glass { background: var(--glass); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }

  /* ---------- start screen ---------- */
  #start { height: 100dvh; display: grid; place-items: center; padding: 16px; overflow-y: auto; }
  .startbox { width: min(380px, 100%); text-align: center; padding: 26px 22px; border-radius: 26px;
    border: 1px solid var(--line); box-shadow: 0 20px 50px rgba(0, 20, 60, .3); }
  .logo { display: flex; justify-content: center; gap: 8px; margin: 0 0 6px; --cw: 52px; }
  .logo .lc { width: var(--cw); height: calc(var(--cw) * 1.35); border-radius: 10px; display: grid; place-items: center;
    font-size: 32px; font-weight: 900; color: #fff; border: 3px solid #fff; text-shadow: 0 2px 0 rgba(0,0,0,.25);
    box-shadow: 0 6px 14px rgba(0,0,0,.25); animation: hop 2.8s ease-in-out infinite; }
  .logo .lc:nth-child(odd) { rotate: -7deg; } .logo .lc:nth-child(even) { rotate: 6deg; }
  .logo .lc:nth-child(2) { animation-delay: .15s; } .logo .lc:nth-child(3) { animation-delay: .3s; }
  .logo .lc:nth-child(4) { animation-delay: .45s; } .logo .lc:nth-child(5) { animation-delay: .6s; }
  @keyframes hop { 0%, 70%, 100% { transform: none; } 80% { transform: translateY(-10px); } }
  .sub { color: var(--muted); margin: 10px 0 24px; }
  .field { width: 100%; padding: 13px 14px; border-radius: 14px; border: 1px solid var(--line);
    background: rgba(255,255,255,.14); color: var(--text); font-size: 17px; outline: none;
    user-select: text; -webkit-user-select: text; }
  .field::placeholder { color: rgba(255,255,255,.6); }
  .field:focus { border-color: var(--accent); background: rgba(255,255,255,.2); }
  .btn { width: 100%; padding: 13px; border-radius: 14px; border: 0; font-weight: 800; font-size: 17px;
    background: var(--accent); color: var(--accent-ink); margin-top: 10px; box-shadow: 0 4px 0 #c79a00;
    transition: transform .1s, box-shadow .1s; }
  .btn:active { transform: translateY(3px); box-shadow: 0 1px 0 #c79a00; }
  .btn.ghost { background: rgba(255,255,255,.16); color: var(--text); border: 1px solid var(--line); box-shadow: none; }
  .row { display: flex; gap: 8px; }
  .row .field { flex: 1; text-transform: uppercase; letter-spacing: 4px; text-align: center; }
  .row .btn { width: auto; padding: 13px 22px; margin-top: 0; }
  .or { color: var(--muted); margin: 22px 0 10px; font-size: 14px; }
  .err { color: #ffd0cc; min-height: 22px; margin-top: 12px; font-size: 15px; text-shadow: 0 1px 2px rgba(0,0,0,.4); }

  /* ---------- game layout ---------- */
  #game { height: 100dvh; display: flex; }
  #main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  header { height: 48px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 12px;
    border-bottom: 1px solid var(--line); }
  header .title { font-weight: 900; letter-spacing: 2px; text-shadow: 0 1px 3px rgba(0,0,0,.3); }
  .chip { border: 0; font-size: 13px; padding: 3px 9px; border-radius: 99px; background: rgba(255,255,255,.16); }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: #9e9e9e; display: inline-block; }
  .dot.on { background: #69f0ae; box-shadow: 0 0 6px #69f0ae; }
  .spacer { flex: 1; }
  .iconbtn { position: relative; background: rgba(255,255,255,.16); border: 1px solid var(--line);
    width: 38px; height: 34px; border-radius: 10px; font-size: 17px; display: grid; place-items: center; }
  .badge { position: absolute; top: -6px; right: -6px; background: #ff5252; color: #fff; font-size: 11px;
    min-width: 18px; height: 18px; border-radius: 9px; display: grid; place-items: center; padding: 0 4px; }

  #board { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: space-evenly;
    padding: 6px 16px 10px; min-height: 0; position: relative; }
  #board.shake { animation: shake .5s; }
  @keyframes shake { 20%, 60% { transform: translateX(-8px) rotate(-.6deg); } 40%, 80% { transform: translateX(8px) rotate(.6deg); } }
  .area { display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; flex-shrink: 0; }
  #status { flex-shrink: 0; }
  .inforow { display: flex; align-items: center; justify-content: center; gap: 6px; height: 30px; width: 0; min-width: 100%; white-space: nowrap; }
  .pinfo { font-size: 14px; display: flex; gap: 6px; align-items: center; padding: 3px 12px; border-radius: 99px;
    transition: background .3s, color .3s; }
  .pinfo .pts { opacity: .85; }
  .pinfo.active { background: var(--accent); color: var(--accent-ink); box-shadow: 0 0 16px rgba(255,213,79,.7); }
  .pinfo.active::before { content: "▶"; font-size: 10px; }
  .poke { font-size: 13px; font-weight: 800; padding: 4px 10px; border-radius: 99px; border: 0;
    background: #ff7043; color: #fff; box-shadow: 0 3px 0 #bf360c; animation: wiggle 2.5s infinite; }
  .poke:disabled { opacity: .45; animation: none; box-shadow: none; }
  @keyframes wiggle { 0%, 85%, 100% { rotate: 0deg; } 88% { rotate: -8deg; } 92% { rotate: 8deg; } 96% { rotate: -4deg; } }

  .grid { --cw: var(--base); display: grid; grid-template-columns: repeat(4, var(--cw)); gap: calc(var(--cw) * .09); }
  .grid.opp { --cw: calc(var(--base) * .55); }
  .mid { --cw: calc(var(--base) * .85); display: flex; align-items: center; gap: calc(var(--cw) * .25); }

  @media (min-width: 1100px) and (min-aspect-ratio: 5/4) {
    :root { --base: min(calc((100vw - 300px - 170px) / 11.6), calc((100dvh - 190px) / 4.9), 112px); }
    #side { width: 300px !important; }
    #board { display: grid; grid-template-columns: auto auto auto; grid-template-rows: 1fr auto auto 1fr;
      grid-template-areas: "opp . me" "opp mid me" "opp status me" "opp . me";
      column-gap: calc(var(--base) * .55); row-gap: 14px; justify-content: center; align-items: center; }
    #opparea { grid-area: opp; } #midarea { grid-area: mid; } #status { grid-area: status; } #myarea { grid-area: me; }
    #myarea { flex-direction: column-reverse; }
    .grid.opp { --cw: var(--base); }
    .mid { --cw: calc(var(--base) * .8); }
    #board #status { --lines: 3; width: max(260px, calc(var(--base) * 3.4)); }
  }

  /* ---------- cards ---------- */
  .card { width: var(--cw); height: calc(var(--cw) * 1.4); perspective: 700px; position: relative;
    transition: opacity .6s, transform .6s; }
  .card .inner { position: absolute; inset: 0; transition: transform .5s cubic-bezier(.4,0,.2,1); transform-style: preserve-3d; }
  .card.up .inner { transform: rotateY(180deg); }
  .face { position: absolute; inset: 0; border-radius: calc(var(--cw) * .13); backface-visibility: hidden;
    -webkit-backface-visibility: hidden; box-shadow: 0 3px 8px rgba(0, 20, 60, .35); overflow: hidden; }
  .back { border: calc(var(--cw) * .05) solid #fff; display: grid; place-items: center;
    background:
      radial-gradient(circle at 50% 50%, rgba(255,255,255,.35), transparent 55%),
      repeating-conic-gradient(from -6deg at 50% 50%,
        var(--c-neg) 0 12deg, var(--c-zero) 0 24deg, var(--c-low) 0 36deg, var(--c-mid) 0 48deg, var(--c-high) 0 60deg); }
  .back span { display: flex; gap: calc(var(--cw) * .005); rotate: -24deg; background: #fff;
    padding: calc(var(--cw) * .03) calc(var(--cw) * .07); border-radius: 99px; box-shadow: 0 1px 3px rgba(0,0,0,.35); }
  .back span i { font-style: normal; font-weight: 900; font-size: calc(var(--cw) * .19); line-height: 1; }
  .back span i:nth-child(1) { color: var(--c-neg); } .back span i:nth-child(2) { color: var(--c-zero); }
  .back span i:nth-child(3) { color: var(--c-low); } .back span i:nth-child(4) { color: #e0a800; }
  .back span i:nth-child(5) { color: var(--c-high); }
  .front { transform: rotateY(180deg); border: calc(var(--cw) * .05) solid #fff; color: #fff; display: grid; place-items: center;
    background: radial-gradient(ellipse 58% 40% at 50% 50%, rgba(255,255,255,.4), rgba(255,255,255,.12) 62%, transparent 64%), var(--cc, #999); }
  .front .n { font-weight: 900; font-size: calc(var(--cw) * .5); line-height: 1;
    text-shadow: 0 0 calc(var(--cw) * .04) rgba(0,0,0,.55), 0 calc(var(--cw) * .025) 0 rgba(0,0,0,.35); }
  .front .c { position: absolute; font-style: normal; font-weight: 900; font-size: calc(var(--cw) * .17); line-height: 1;
    text-shadow: 0 1px 1px rgba(0,0,0,.4); }
  .front .tl { top: calc(var(--cw) * .06); left: calc(var(--cw) * .08); }
  .front .br { bottom: calc(var(--cw) * .06); right: calc(var(--cw) * .08); rotate: 180deg; }
  .front.v-neg { --cc: var(--c-neg); } .front.v-zero { --cc: var(--c-zero); } .front.v-low { --cc: var(--c-low); }
  .front.v-mid { --cc: var(--c-mid); } .front.v-high { --cc: var(--c-high); }
  .card.gone { opacity: 0; transform: translateY(-24px) scale(.5) rotate(10deg); pointer-events: none; }
  .card.tap { cursor: pointer; }
  .card.tap .face { box-shadow: 0 0 0 3px var(--accent), 0 0 16px rgba(255,213,79,.8); }
  .card.empty .face { visibility: hidden; }
  .card.empty::after { content: ""; position: absolute; inset: 0; border-radius: calc(var(--cw) * .13);
    border: 2px dashed rgba(255,255,255,.5); }
  .card.hl::before { content: ""; position: absolute; inset: calc(var(--cw) * -.08); border-radius: calc(var(--cw) * .18);
    border: 3px solid #fff; box-shadow: 0 0 14px #fff, inset 0 0 10px rgba(255,255,255,.6); z-index: 2; pointer-events: none;
    animation: ring 1s ease-in-out 3 forwards; }
  @keyframes ring { 0%, 100% { opacity: 0; transform: scale(1.08); } 40% { opacity: 1; transform: scale(1); } }
  .delta { position: absolute; top: calc(var(--cw) * -.14); right: calc(var(--cw) * -.1); z-index: 3; pointer-events: none;
    font-size: calc(max(var(--cw) * .2, 12px)); font-weight: 900; padding: 2px 7px; border-radius: 99px; color: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.3); transition: opacity .15s, transform .15s; }
  .delta.good { background: #2e7d32; } .delta.bad { background: #c62828; } .delta.even { background: #546e7a; }
  .delta.boom { background: linear-gradient(90deg, #ff6f00, #d500f9); }
  .delta:empty { display: none; }
  @media (hover: hover) { .delta { opacity: 0; transform: scale(.7); } .card:hover .delta { opacity: 1; transform: none; } }
  .flyer { position: fixed; transform-origin: 0 0; z-index: 35; pointer-events: none; transition: none; }
  .flyer .face { box-shadow: 0 14px 26px rgba(0, 20, 60, .45); }
  .ghost { display: none; position: absolute; --cw: calc(var(--base) * .52); width: var(--cw); height: calc(var(--cw) * 1.4);
    right: calc(var(--base) * -.05); bottom: calc(var(--base) * -.05); rotate: 7deg; z-index: 2; transition: transform .15s; }
  .ghost .front { transform: none; }
  .card.hold .ghost { display: block; }
  .card.tap .ghost .face { box-shadow: 0 5px 12px rgba(0, 20, 60, .5), 0 0 0 calc(var(--cw) * .05) var(--accent); }
  .fliphint { display: none; position: absolute; top: calc(var(--cw) * .07); left: calc(var(--cw) * .07); z-index: 2;
    width: calc(var(--cw) * .32); height: calc(var(--cw) * .32); border-radius: 50%; place-items: center; pointer-events: none;
    background: rgba(10, 24, 58, .75); color: #fff; font-weight: 900; font-size: calc(var(--cw) * .22); box-shadow: 0 0 0 2px #fff; }
  .card.canflip .fliphint { display: grid; }
  @media (hover: hover) { .ghost:hover { transform: scale(1.08); } }

  .pile { width: var(--cw); white-space: nowrap; display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 12px; font-weight: 700;
    text-shadow: 0 1px 3px rgba(0,0,0,.5); }

  #status { --lines: 2; height: calc(var(--lines) * 1.3em + 14px); width: min(100%, 380px); line-height: 1.3; overflow: hidden;
    text-align: center; font-size: 15px; padding: 7px 16px; border-radius: 18px;
    display: grid; place-items: center; transition: background .3s, color .3s; }
  #status:empty { visibility: hidden; }
  #status.me { background: var(--accent); color: var(--accent-ink); font-weight: 800; box-shadow: 0 0 20px rgba(255,213,79,.6); }
  #banner.off { visibility: hidden; }
  #banner { font-size: 13px; padding: 4px 12px; border-radius: 99px; background: #ff7043; color: #fff; font-weight: 800;
    animation: pulse 1s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.06); } }

  /* ---------- results ---------- */
  #resultwrap { position: absolute; inset: 0; z-index: 25; display: grid; place-items: center; padding: 16px;
    background: rgba(5, 12, 35, .35); backdrop-filter: blur(2px); -webkit-backdrop-filter: blur(2px); }
  #resultwrap.peek { background: none; backdrop-filter: none; -webkit-backdrop-filter: none; pointer-events: none; place-items: end center; }
  #resultwrap.peek #result { display: none; }
  #showres { display: none; pointer-events: auto; width: auto; padding: 10px 20px; }
  #resultwrap.peek #showres { display: block; }
  #result { width: min(360px, 100%); background: #fff; color: #1b2a4a; border-radius: 22px; padding: 18px 18px 16px;
    box-shadow: 0 24px 60px rgba(0, 10, 40, .5); text-align: center; animation: popin .45s cubic-bezier(.3,1.5,.5,1); }
  @keyframes popin { from { transform: scale(.6); opacity: 0; } }
  #result h3 { margin: 0 0 4px; font-size: 22px; }
  #result .medal { font-size: 54px; line-height: 1; height: 0; overflow: visible; transition: height .3s; }
  #result .medal.show { height: 60px; animation: bounce .8s cubic-bezier(.3,1.8,.5,1); }
  @keyframes bounce { from { transform: scale(0) rotate(-30deg); } }
  #result .caption { color: #6a7896; font-size: 14px; min-height: 18px; margin-bottom: 8px; }
  .rgrid { display: grid; grid-template-columns: 1fr auto auto; gap: 6px 14px; align-items: center; font-size: 16px; }
  .rgrid .h { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #8a97b3; }
  .rgrid .nm { text-align: left; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rgrid .nm small { font-weight: 600; color: #8a97b3; }
  .rgrid .sc { position: relative; font-weight: 800; min-width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
  .rgrid .tot { font-weight: 900; font-size: 20px; min-width: 54px; text-align: right; font-variant-numeric: tabular-nums; }
  .stamp { position: absolute; right: calc(100% + 6px); top: 50%; translate: 0 -50%; font-style: normal; font-weight: 900; font-size: 20px; color: #e53935;
    border: 3px solid #e53935; border-radius: 8px; padding: 0 5px; rotate: -14deg; background: rgba(255,255,255,.85);
    opacity: 0; transform: scale(3); pointer-events: none; }
  .stamp.slam { animation: slam .35s cubic-bezier(.5,0,.8,.6) forwards; }
  @keyframes slam { to { opacity: 1; transform: scale(1); } }
  .rfoot { display: flex; gap: 8px; margin-top: 14px; transition: opacity .3s; }
  .rfoot .btn { margin: 0; }
  .rfoot .btn.ghost { width: auto; color: #1b2a4a; background: #eef2fb; border-color: #dbe2f2; white-space: nowrap; }
  .rfoot.wait { opacity: 0; pointer-events: none; }

  @keyframes blink { 50% { opacity: .4; } }

  /* ---------- side panel ---------- */
  #side { width: 320px; flex: none; border-left: 1px solid var(--line); background: var(--glass-strong);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); display: flex; flex-direction: column; min-height: 0; }
  #side section { padding: 12px; border-bottom: 1px solid var(--line); }
  #side h4 { margin: 0 0 8px; font-size: 13px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--muted); }
  #scores { width: 100%; border-collapse: collapse; font-size: 14px; }
  #scores th, #scores td { padding: 3px 6px; text-align: right; border-bottom: 1px solid rgba(255,255,255,.08); }
  #scores th:first-child, #scores td:first-child { text-align: left; color: var(--muted); }
  #scores tfoot td { font-weight: 800; border-top: 1px solid var(--line); border-bottom: 0; }
  .scorewrap { max-height: 32vh; overflow-y: auto; }
  .x2 { color: #ffab91; font-weight: 800; }
  #chatsec { flex: 1; display: flex; flex-direction: column; min-height: 0; border-bottom: 0 !important; }
  #msgs { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 2px; min-height: 60px;
    user-select: text; -webkit-user-select: text; }
  .msg { max-width: 85%; padding: 7px 11px; border-radius: 16px; font-size: 14px; line-height: 1.3; word-wrap: break-word;
    background: rgba(255,255,255,.16); align-self: flex-start; border-bottom-left-radius: 4px; }
  .msg.mine { background: #1e88e5; align-self: flex-end; border-bottom-left-radius: 16px; border-bottom-right-radius: 4px; }
  .msg small { display: block; font-size: 11px; color: var(--muted); }
  .emojis { display: flex; flex-wrap: wrap; gap: 4px; margin: 8px 0; }
  .emojis button { background: rgba(255,255,255,.14); border: 1px solid var(--line); border-radius: 10px;
    font-size: 20px; padding: 3px 7px; }
  .emojis button:active { transform: scale(.9); }
  #chatform { display: flex; gap: 6px; }
  #chatform .field { padding: 9px 12px; font-size: 15px; }
  #chatform .btn { width: auto; margin: 0; padding: 9px 14px; font-size: 15px; }
  .leave { background: none; border: 0; color: var(--muted); font-size: 13px; text-decoration: underline; padding: 0; }
  .drawerclose { display: none; }
  @media (max-width: 899px) {
    #side { position: fixed; inset: 0 0 0 auto; width: min(360px, 92vw); z-index: 20; background: rgba(12, 26, 62, .94);
      transform: translateX(105%); transition: transform .25s; box-shadow: -8px 0 30px rgba(0,0,0,.4); }
    #side.open { transform: none; }
    .drawerclose { display: grid; }
  }
  @media (min-width: 900px) { #sidebtn { display: none; } }

  .float { position: absolute; font-size: 44px; pointer-events: none; z-index: 30; animation: floatup 2.2s ease-out forwards; }
  @keyframes floatup { 0% { opacity: 0; transform: translateY(20px) scale(.5); } 15% { opacity: 1; transform: translateY(0) scale(1.2); }
    100% { opacity: 0; transform: translateY(-120px) scale(1); } }
  .pokebubble { position: fixed; left: 50%; top: 38%; z-index: 40; pointer-events: none; translate: -50% -50%;
    background: #ff7043; color: #fff; font-weight: 900; font-size: 28px; padding: 14px 24px; border-radius: 22px;
    border: 4px solid #fff; box-shadow: 0 16px 40px rgba(0,0,0,.35); white-space: nowrap;
    animation: pokein 2.2s cubic-bezier(.3,1.6,.5,1) forwards; }
  .joinbubble { background: #43a047; font-size: 32px; animation-duration: 3.4s; }
  .pokebubble small { display: block; font-size: 14px; font-weight: 700; opacity: .9; }
  @keyframes pokein { 0% { transform: scale(0) rotate(-20deg); } 15% { transform: scale(1) rotate(-4deg); }
    25%, 45%, 65% { transform: rotate(4deg); } 35%, 55% { transform: rotate(-4deg); } 85% { opacity: 1; transform: none; } 100% { opacity: 0; transform: translateY(-30px); } }
  #fx { position: fixed; inset: 0; width: 100vw; height: 100vh; pointer-events: none; z-index: 45; }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: rgba(10, 24, 58, .92); color: #fff;
    padding: 10px 16px; border-radius: 14px; font-size: 14px; z-index: 50; box-shadow: 0 4px 16px rgba(0,0,0,.4);
    transition: opacity .3s; max-width: calc(100vw - 32px); text-align: center; }
  body.spectator .rfoot #nextbtn { display: none; }
  #toast.fade { opacity: 0; pointer-events: none; }
</style>
</head>
<body>

<div id="sky">
  <div id="stars"></div>
  <div id="sun"></div>
  <div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>
  <div class="cloud c4"></div><div class="cloud c5"></div>
</div>

<div id="start">
  <div class="startbox glass">
    <div class="logo" aria-label="Nimbo">
      <span class="lc" style="background:var(--c-neg)">N</span><span class="lc" style="background:var(--c-zero)">I</span><span class="lc" style="background:var(--c-low)">M</span><span class="lc" style="background:var(--c-mid)">B</span><span class="lc" style="background:var(--c-high)">O</span>
    </div>
    <p class="sub">Play online with a friend</p>
    <input id="name" class="field" maxlength="16" placeholder="Your name" autocomplete="off">
    <button id="create" class="btn">Create game</button>
    <button id="resume" class="btn ghost hidden"></button>
    <div class="or">— or join a game —</div>
    <div class="row">
      <input id="joincode" class="field" maxlength="4" placeholder="CODE" autocomplete="off" autocapitalize="characters">
      <button id="join" class="btn">Join</button>
    </div>
    <div id="starterr" class="err"></div>
  </div>
</div>

<div id="game" class="hidden">
  <div id="main">
    <header class="glass">
      <span class="title">NIMBO</span>
      <button class="chip" id="roomchip" title="Copy room code"></button>
      <span class="dot" id="conndot" title="Opponent connection"></span>
      <span class="spacer"></span>
      <button class="iconbtn" id="mutebtn" title="Sound">🔊</button>
      <button class="iconbtn" id="sidebtn" title="Chat &amp; scores">💬<span class="badge hidden" id="badge">0</span></button>
    </header>
    <div id="board">
      <div class="area" id="opparea">
        <div class="inforow">
          <div class="pinfo glass" id="oppinfo"></div>
          <button class="poke hidden" id="pokebtn">⏰ Hurry up!</button>
        </div>
        <div class="grid opp" id="oppgrid"></div>
      </div>
      <div class="area" id="midarea">
        <div id="banner" class="off">&nbsp;</div>
        <div class="mid" id="piles">
          <div class="pile"><div id="deck"></div><span id="deckcount"></span></div>
          <div class="pile"><div id="discard"></div><span>Discard</span></div>
          <div class="pile"><div id="held"></div><span id="heldlabel">&nbsp;</span></div>
        </div>
      </div>
      <div id="status" class="glass"></div>
      <div class="area" id="myarea">
        <div class="grid mine" id="mygrid"></div>
        <div class="inforow"><div class="pinfo glass" id="myinfo"></div></div>
      </div>
      <div id="resultwrap" class="hidden">
        <div id="result"></div>
        <button class="btn" id="showres">📊 Show results</button>
      </div>
    </div>
  </div>
  <aside id="side">
    <section style="display:flex;align-items:center;gap:8px">
      <h4 style="margin:0;flex:1">Scores</h4>
      <button class="iconbtn drawerclose" id="sideclose">✕</button>
    </section>
    <section>
      <div class="scorewrap"><table id="scores"></table></div>
    </section>
    <section id="chatsec">
      <h4>Chat</h4>
      <div id="msgs"></div>
      <div class="emojis" id="emojis"></div>
      <form id="chatform" autocomplete="off">
        <input id="chatin" class="field" maxlength="200" placeholder="Message…">
        <button class="btn" type="submit">Send</button>
      </form>
      <div style="margin-top:10px;text-align:right"><button class="leave" id="leave">Leave game</button></div>
    </section>
  </aside>
</div>

<canvas id="fx"></canvas>
<div id="toast" class="fade"></div>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const ALPH = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const PREFIX = 'nimbo-rmt-';
  const EMOJIS = ['👍', '😂', '😱', '😎', '🎉', '😭', '🙈', '🔥'];
  const TIMES = ['dawn', 'morning', 'noon', 'sunset', 'night'];
  const SKY_INK = { dawn: '#6d8fd6', morning: '#3d8fd9', noon: '#1565c0', sunset: '#34295f', night: '#050920' };
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
    del(k) { try { localStorage.removeItem(k); } catch {} },
  };
  // which role this tab plays — survives a reload, but not a new tab
  const active = {
    get() { try { return sessionStorage.getItem('nimbo-active'); } catch { return null; } },
    set(r) { try { sessionStorage.setItem('nimbo-active', r); } catch {} },
    del() { try { sessionStorage.removeItem('nimbo-active'); } catch {} },
  };
  const rnd = n => Math.floor(Math.random() * n);
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const genCode = () => Array.from({ length: 4 }, () => ALPH[rnd(ALPH.length)]).join('');
  const peerId = c => PREFIX + c.toLowerCase();
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

  let role = null, me = 0, peer = null, conn = null, code = null, hostKeepsCode = false, hostOpened = false, resumeTries = 0;
  let botTimer = null;
  // host: people watching (token -> { c, name, sid }); guest: whether I only watch
  const spectators = new Map();
  let seatTimer = null, spectating = false, mySid = null;
  const selfId = () => (spectating ? 's:' + mySid : me);
  const who = p => (p === me && !spectating ? 'You' : view.names[p]);
  const BOT_NAME = 'Bot 🤖';
  let S = null, view = null, prev = null, animatedMoveId = null;
  let chat = [], unread = 0, guestToken = null, myToken = null, joinedOnce = false, retryTimer = null;
  let muted = store.get('nimbo-muted') === true, pokeReadyAt = 0;
  const pendingGone = new Set();

  function toast(t, ms = 3000) {
    const el = $('#toast'); el.textContent = t; el.classList.remove('fade');
    clearTimeout(toast.t); toast.t = setTimeout(() => el.classList.add('fade'), ms);
  }
  function setSky(tod) {
    if (document.documentElement.dataset.tod === tod) return;
    document.documentElement.dataset.tod = tod;
    document.querySelector('meta[name=theme-color]').content = SKY_INK[tod];
  }

  /* ---------- sound ---------- */
  let actx = null;
  document.addEventListener('pointerdown', () => {
    if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch {} }
    else if (actx.state === 'suspended') actx.resume();
  }, { capture: true });
  function tone(f, dur, type = 'sine', vol = .15, delay = 0, f2 = null) {
    if (muted || !actx) return;
    const t = actx.currentTime + delay, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .01);
    g.gain.exponentialRampToValueAtTime(.001, t + dur);
    o.connect(g).connect(actx.destination); o.start(t); o.stop(t + dur + .05);
  }
  const sfx = {
    flip() { tone(420, .07, 'triangle', .12); tone(640, .06, 'triangle', .08, .04); },
    whoosh() { tone(900, .22, 'sine', .07, 0, 250); },
    turn() { tone(660, .15, 'sine', .14); tone(880, .22, 'sine', .14, .12); },
    clear() { [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, .22, 'triangle', .12, i * .06)); tone(160, .3, 'sine', .2, 0, 60); },
    end() { [392, 523, 659, 784].forEach((f, i) => tone(f, .3, 'sine', .12, i * .12)); },
    msg() { tone(990, .08, 'sine', .08); tone(1320, .08, 'sine', .06, .06); },
    tick() { tone(1500 + rnd(300), .025, 'square', .025); },
    stamp() { tone(110, .3, 'sawtooth', .18, 0, 45); tone(70, .35, 'sine', .3); },
    win() { [523, 659, 784, 1047, 784, 1047].forEach((f, i) => tone(f, i === 5 ? .6 : .16, 'triangle', .13, i * .13)); },
    sad() { [392, 370, 349, 262].forEach((f, i) => tone(f, i === 3 ? .7 : .28, 'triangle', .12, i * .3)); },
    poke() { for (let i = 0; i < 8; i++) tone(i % 2 ? 1450 : 1150, .06, 'square', .05, i * .07); },
    join() {
      tone(784, .45, 'sine', .2); tone(622, .7, 'sine', .2, .4); // ding-dong
      [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i === 4 ? .5 : .18, 'triangle', .13, 1.1 + i * .09));
    },
  };

  /* ---------- confetti ---------- */
  const fx = (() => {
    const cv = $('#fx'), ctx = cv.getContext('2d');
    const COLORS = ['#ffd54f', '#ff7043', '#29b6f6', '#66bb6a', '#ab47bc', '#ffffff', '#e53935', '#3f51b5'];
    let parts = [], running = false, dpr = 1;
    const size = () => { dpr = Math.min(2, devicePixelRatio || 1); cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; };
    addEventListener('resize', size); size();
    function loop() {
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0); ctx.clearRect(0, 0, innerWidth, innerHeight);

        if (old && old.c !== c) old.c.close();
        const sid = old ? old.sid : Math.random().toString(36).slice(2, 8);
        spectators.set(d.token, { c, name, sid });
        c.send({ t: 'welcome', chat, spectator: true, sid });

      guestToken = d.token;

      const name = (d.name || 'Friend').slice(0, 16);
      S.moves = [];

    else if (d.t === 'chat') { addChat(1, d.text); toAll({ t: 'chat', from: 1, text: d.text }, c); }
    else if (d.t === 'emoji') { showEmoji(1, d.e); toAll({ t: 'emoji', from: 1, e: d.e }, c); }
    else if (d.t === 'leave') freeSeat();
    else if (d.t === 'poke') gotPoked();
  }

  // the player left: the first spectator takes over the running game, otherwise the bot does
  function freeSeat() {
    clearTimeout(seatTimer); seatTimer = null;
    const old = conn; conn = null; guestToken = null;
    if (old) old.close();
    const first = spectators.entries().next().value;
    if (first) {
      const [tok, sp] = first;
      spectators.delete(tok);
      guestToken = tok; conn = sp.c; S.names[1] = sp.name;
      sp.c.send({ t: 'promoted' });
      setOnline(true); toast(`${sp.name} takes over`);
    } else {

    }
    S.moves = []; commit();
  }
  function joinGame(c, resume = false) {
    role = 'guest'; me = 1; code = c; joinedOnce = false;
    // after a reload the host may be reloading too — keep trying for a while
    resumeTries = resume ? 12 : 0;
    const saved = store.get('nimbo-guest');
    myToken = saved && saved.code === code ? saved.token : Math.random().toString(36).slice(2) + Date.now().toString(36);
    store.set('nimbo-guest', { code, token: myToken });
    $('#starterr').textContent = resume ? `Reconnecting to game ${code}…` : 'Connecting…';
    peer = new Peer();
    peer.on('open', connectToHost);
    peer.on('disconnected', () => { const p = peer; setTimeout(() => { if (!p.destroyed) p.reconnect(); }, 1500); });
    peer.on('error', e => {
      if (e.type === 'peer-unavailable') {
        if (!joinedOnce && resumeTries-- > 0) setTimeout(connectToHost, 2500);
        else if (!joinedOnce) { $('#starterr').textContent = `No game found with code ${code}.`; peer.destroy(); role = null; active.del(); }
        else scheduleReconnect();
      } else if (!joinedOnce) {
        $('#starterr').textContent = 'Connection problem: ' + e.type; peer.destroy(); role = null;
      } else toast('Connection problem: ' + e.type);
    });
  }
  function connectToHost() {
    const c = peer.connect(peerId(code), { reliable: true });
    conn = c;
    c.on('open', () => c.send({ t: 'hello', name: myName(), token: myToken }));
    c.on('data', onGuestData);
    c.on('close', () => { if (conn === c) { conn = null; setOnline(false); scheduleReconnect(); } });
  }
  function scheduleReconnect() {
    if (retryTimer || role !== 'guest') return;

    retryTimer = setTimeout(() => {
      retryTimer = null;

      connectToHost();
    }, 2500);
  }
  function onGuestData(d) {
    if (d.t === 'welcome') {

      spectating = !!d.spectator; mySid = d.sid || null;
      document.body.classList.toggle('spectator', spectating);
      showGame(); setOnline(true); renderChat();
    } else if (d.t === 'state') { view = d.v; render(); }
    else if (d.t === 'chat') addChat(d.from ?? 0, d.text, d.name);
    else if (d.t === 'emoji') showEmoji(d.from ?? 0, d.e);
    else if (d.t === 'promoted') {

    }
    else if (d.t === 'poke') gotPoked();

      $('#starterr').textContent = 'This game already has two players.';
      peer.destroy(); role = null; store.del('nimbo-guest'); active.del();
    }
  }

  /* ---------- chat, emojis, poke ---------- */
  function addChat(from, text, name) {
    text = String(text).slice(0, 200);
    if (!text.trim()) return;
    chat.push(name ? { from, name: String(name).slice(0, 16), text } : { from, text }); if (chat.length > 100) chat.shift();
    if (role === 'host') store.set('nimbo-host', { code, state: S, guestToken, chat });
    if (from !== selfId()) {
      sfx.msg();
      if (!$('#side').classList.contains('open') && innerWidth < 900) unread++;
    }
    renderChat();
  }
  function renderChat() {
    const box = $('#msgs'); box.innerHTML = '';
    const names = view ? view.names : (S ? S.names : ['', '']);
    chat.forEach(m => {
      const d = document.createElement('div');

  }
  function sendChat(text) {

    addChat(selfId(), text);
    if (role === 'host') toAll({ t: 'chat', from: 0, text });
    else if (conn && conn.open) conn.send({ t: 'chat', text });
  }
  function showEmoji(from, e) {

    const f = document.createElement('div');

    if (from !== me) tone(740, .1, 'sine', .08);
  }
  function sendEmoji(e) {
    showEmoji(selfId(), e);
    if (role === 'host') toAll({ t: 'emoji', from: 0, e });
    else if (conn && conn.open) conn.send({ t: 'emoji', e });
  }
  function sendPoke() {
    if (spectating || Date.now() < pokeReadyAt || !conn || !conn.open) return;
    conn.send({ t: 'poke' });
    pokeReadyAt = Date.now() + 8000;
    toast(`⏰ You poked ${view.names[1 - me]}`, 1800);
    render(); setTimeout(render, 8100);
  }
  function celebrateJoin(name) {
    const el = document.createElement('div');

    el.innerHTML = '🎉 <span></span> joined!<small>New game — good luck!</small>';

    document.body.appendChild(el); setTimeout(() => el.remove(), 3500);
    sfx.join();
    fx.burst(innerWidth / 2, innerHeight * .38, 140); setTimeout(() => fx.rain(1800), 900);
    if (navigator.vibrate) navigator.vibrate([120, 70, 120, 70, 300]);

      });

  }
  function gotPoked() {
    const b = $('#board'); b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake');
    const el = document.createElement('div');
    el.className = 'pokebubble';
    el.innerHTML = '⏰ Hurry up!<small></small>';
    el.querySelector('small').textContent = `${view ? view.names[1 - me] : 'Your friend'} is waiting…`;
    document.body.appendChild(el); setTimeout(() => el.remove(), 2300);
    sfx.poke();
    if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
  }

  /* ---------- cards & animation helpers ---------- */
  const colorClass = v => v < 0 ? 'v-neg' : v === 0 ? 'v-zero' : v <= 4 ? 'v-low' : v <= 8 ? 'v-mid' : 'v-high';
  const colorOf = v => getComputedStyle(document.documentElement).getPropertyValue('--c-' + colorClass(v).slice(2)).trim();
  const FRONT = '<div class="face front"><i class="c tl"></i><b class="n"></b><i class="c br"></i></div>';
  function cardEl() {
    const c = document.createElement('div');
    c.className = 'card';
    c.innerHTML = '<div class="inner"><div class="face back"><span><i>N</i><i>I</i><i>M</i><i>B</i><i>O</i></span></div>' +
      FRONT + '</div><span class="delta"></span>';
    return c;
  }
  function setFace(front, v) {
    front.className = 'face front ' + colorClass(v);
    front.querySelectorAll('.c, .n').forEach(x => { x.textContent = v; });
  }
  function paint(c, v, up, opts = {}) {
    if (v !== null && v !== undefined && c._v !== v) {
      c._v = v;
      setFace(c.querySelector('.front'), v);
    }
    c.classList.toggle('up', !!up);
    c.classList.toggle('gone', !!opts.gone);
    c.classList.toggle('tap', !!opts.tap);
    c.classList.toggle('empty', !!opts.empty);
    const d = c.querySelector('.delta');
    if (d) { d.textContent = opts.delta ? opts.delta.text : ''; d.className = 'delta' + (opts.delta ? ' ' + opts.delta.cls : ''); }
  }
  function buildGrid(el, onTap) {
    el.innerHTML = ''; el._cells = [];
    for (let i = 0; i < 12; i++) {
      const c = cardEl();
      if (onTap) {
        c.insertAdjacentHTML('beforeend', '<span class="fliphint">↻</span><div class="ghost">' + FRONT + '</div>');
        c._ghost = c.querySelector('.ghost');
        c.addEventListener('click', e => onTap(i, !!e.target.closest('.ghost')));
      }
      el.appendChild(c); el._cells.push(c);
    }
  }
  function fly(from, to, v, faceDown, delay = 0) {
    if (reducedMotion) return;
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    if (!a.width || !b.width) return;
    const c = cardEl(); c.classList.add('flyer');
    c.style.left = a.left + 'px'; c.style.top = a.top + 'px'; c.style.setProperty('--cw', a.width + 'px');
    paint(c, v, !faceDown);
    document.body.appendChild(c);
    to.style.visibility = 'hidden';
    to._flights = (to._flights || 0) + 1;
    const s = b.width / a.width;
    const lift = Math.min(60, Math.abs(b.top - a.top) * .25 + 20);
    const anim = c.animate([
      { transform: 'translate(0,0) scale(1) rotate(0deg)' },
      { transform: `translate(${(b.left - a.left) / 2}px, ${(b.top - a.top) / 2 - lift}px) scale(${(1 + s) / 2 * 1.12}) rotate(-6deg)`, offset: .5 },
      { transform: `translate(${b.left - a.left}px, ${b.top - a.top}px) scale(${s}) rotate(0deg)` },
    ], { duration: 520, easing: 'cubic-bezier(.35,.7,.35,1)', delay, fill: 'both' });
    if (faceDown) setTimeout(() => c.classList.add('up'), delay + 80);
    anim.onfinish = () => {
      if (--to._flights <= 0) to.style.visibility = '';
      c.remove();
    };
  }
  function highlight(cell) { cell.classList.remove('hl'); void cell.offsetWidth; cell.classList.add('hl'); setTimeout(() => cell.classList.remove('hl'), 3100); }
  const gridEl = p => (p === me ? $('#mygrid') : $('#oppgrid'));

  function onMyCard(i, onGhost) {
    const v = view; if (!v) return;
    const c = v.grids[me][i];
    if (v.phase === 'setup' && !c.up) return send({ type: 'flip', i });
    if (v.phase !== 'play' || v.turn !== me) return;
    if (v.step === 'choose' && !c.gone) send({ type: 'takeSwap', i });
    else if (v.step === 'drawn' && !c.up && !c.gone && !onGhost) send({ type: 'dropFlip', i });
    else if (v.step === 'drawn' || v.step === 'took') send({ type: 'swap', i });
    else if (v.step === 'flip' && !c.up) send({ type: 'flip', i });
  }

  function swapPreview(g, held, i) {
    const c = g[i]; if (c.gone) return null;
    const col = i % 4, others = [col, col + 4, col + 8].filter(j => j !== i).map(j => g[j]);
    const makesColumn = others.every(o => o.up && !o.gone && o.v === held);
    if (makesColumn) {
      if (!c.up) return { text: '💥', cls: 'boom' };
      const d = -(c.v + others[0].v + others[1].v);
      return { text: '💥 ' + (d < 0 ? '−' + -d : '±0'), cls: 'boom' };
    }
    if (!c.up) return null;
    const d = held - c.v;
    return d < 0 ? { text: '−' + -d, cls: 'good' } : d > 0 ? { text: '+' + d, cls: 'bad' } : { text: '±0', cls: 'even' };
  }

  /* ---------- rendering ---------- */
  function render() {
    const v = view; if (!v) return;
    const op = 1 - me, lobby = v.phase === 'lobby';
    const online = $('#conndot').classList.contains('on');
    $('#roomchip').textContent = 'Room ' + code;
    ['#opparea', '#midarea', '#status', '#myarea'].forEach(s => $(s).style.visibility = lobby ? 'hidden' : '');
    setSky(lobby ? 'morning' : TIMES[(v.round - 1) % TIMES.length]);
    if (lobby) { renderScores(); prev = v; animatedMoveId = v.moveId; return; }

    const fresh = prev && v.moveId !== animatedMoveId ? v.moves : [];
    animatedMoveId = v.moveId;
    updateResult(v, !!(prev && prev.phase === 'play'));
    if (fresh.some(m => m.k === 'deal')) pendingGone.clear();
    const flying = fresh.some(m => m.k === 'swap' || m.k === 'drop');
    for (const m of fresh) {
      if (!m.cleared || !m.cleared.length) continue;
      const delay = m.k === 'reveal' ? 1100 : flying ? 750 : 450;
      m.cleared.forEach(({ p, col }) => [col, col + 4, col + 8].forEach(j => pendingGone.add(p + ':' + j)));
      setTimeout(() => poofColumns(m.cleared), delay);
    }
    if (fresh.some(m => m.k === 'reveal') && prev && prev.grids.length) {
      [0, 1].forEach(p => {
        let k = 0;
        gridEl(p)._cells.forEach((cell, j) => {
          if (prev.grids[p][j] && !prev.grids[p][j].up) {
            const inner = cell.querySelector('.inner');
            inner.style.transitionDelay = (k++ * 90) + 'ms';
            setTimeout(() => { inner.style.transitionDelay = ''; }, 2500);
          }
        });
      });
    }

    const myTurn = !spectating && v.phase === 'play' && v.turn === me;
    const g = v.grids[me], og = v.grids[op];
    const setupMine = !spectating && v.phase === 'setup' && g.filter(c => c.up && !c.gone).length < 2;
    const setupOpp = v.phase === 'setup' && og.filter(c => c.up && !c.gone).length < 2;
    const holding = myTurn && (v.step === 'drawn' || v.step === 'took') && v.held !== null;
    // at the start of my turn the discard is offered on every slot; Space / the deck draws a new card instead
    const offer = holding ? v.held : myTurn && v.step === 'choose' && v.discardTop !== null ? v.discardTop : null;

    g.forEach((c, i) => {
      const cell = $('#mygrid')._cells[i], here = offer !== null && !c.gone;
      paint(cell, c.v, c.up, {
        gone: c.gone && !pendingGone.has(me + ':' + i),
        tap: !c.gone && ((setupMine && !c.up) || (myTurn && (v.step !== 'flip' || !c.up))),
        delta: offer !== null ? swapPreview(g, offer, i) : null,
      });
      cell.classList.toggle('hold', here);
      cell.classList.toggle('canflip', here && v.step === 'drawn' && !c.up);
      if (here) setFace(cell._ghost.querySelector('.front'), offer);
    });
    og.forEach((c, i) => paint($('#oppgrid')._cells[i], c.v, c.up, { gone: c.gone && !pendingGone.has(op + ':' + i) }));

    const sum = gr => gr.reduce((s, c) => s + (c.up && !c.gone ? c.v : 0), 0);
    const info = (el, name, p, active) => {
      el.innerHTML = '';
      el.classList.toggle('active', active);
      const b = document.createElement('b'); b.textContent = name;
      const s = document.createElement('span'); s.className = 'pts';
      s.textContent = `${shownTotal(v, p)} pts · showing ${sum(v.grids[p])}` + (p === op && !online && !v.bot ? ' · offline' : '');
      el.append(b, s);
    };
    info($('#oppinfo'), v.names[op], op, v.turn === op && v.phase === 'play');
    info($('#myinfo'), who(me), me, v.turn === me && v.phase === 'play');
    const pk = $('#pokebtn');
    pk.classList.toggle('hidden', spectating || !((v.phase === 'play' && v.turn === op) || (setupOpp && !setupMine)) || !online);
    pk.disabled = Date.now() < pokeReadyAt;

    const deck = $('#deck')._c, disc = $('#discard')._c, held = $('#held')._c;
    const canChoose = myTurn && v.step === 'choose';
    paint(deck, null, false, { tap: canChoose });
    $('#deckcount').textContent = `Deck ${v.deckCount}`;
    paint(disc, v.discardTop, v.discardTop !== null, {
      tap: (canChoose && v.discardTop !== null) || (myTurn && v.step === 'flip'),
      empty: v.discardTop === null,
    });
    // on my turn the discard is already offered on my grid, so the pile only shows during the opponent's turn
    $('#discard').parentElement.style.visibility = myTurn ? 'hidden' : '';
    // my own drawn card is shown on my grid (ghosts); this pile only shows the opponent's
    const oppHeld = v.held !== null && v.held !== undefined && v.turn === op;
    paint(held, v.held, oppHeld, { empty: !oppHeld });
    $('#held').parentElement.style.visibility = oppHeld ? '' : 'hidden';
    $('#heldlabel').textContent = oppHeld ? `${v.names[op]}'s card` : ' ';

    const banner = $('#banner');
    if (v.phase === 'play' && v.finisher !== null) {
      banner.textContent = v.finisher === me ? `${v.names[op]} gets one last turn!` : '⚠️ Last turn!';
      banner.classList.remove('off');
    } else banner.classList.add('off');

    const st = $('#status');
    let msg = '';
    if (v.phase === 'setup') msg = setupMine ? 'Flip 2 of your cards to start' : `Waiting for ${v.names[op]} to flip 2 cards…`;
    else if (v.phase === 'play') {
      if (myTurn) msg = {
        choose: 'Tap a spot to place the discard — or Space / deck for a new card',
        drawn: 'Tap the small card to place it — or a ↻ card to flip it',
        took: 'Tap one of your cards to swap it',
        flip: 'Flip a face-down card — or tap the discard to take yours back',
      }[v.step];
      else msg = `${v.names[op]} is playing…`;
    }
    if (spectating) msg = `👀 Watching — ${v.phase === 'play' ? v.names[v.turn] + ' is playing…' : 'cards are being flipped…'}`;
    st.textContent = msg; st.classList.toggle('me', myTurn || setupMine);

    animateMoves(fresh);
    if (prev && prev.seq !== v.seq) sounds(prev, v, fresh);
    prev = v;
    renderScores(); renderChat();
  }

  function animateMoves(moves) {
    const deck = $('#deck')._c, disc = $('#discard')._c, held = $('#held')._c;
    for (const m of moves) {
      const cell = m.i !== undefined ? gridEl(m.p)._cells[m.i] : null;
      if (m.k === 'draw') {
        const from = m.from === 'deck' ? deck : disc;
        if (m.p === me) {

            .forEach((x, j) => fly(from, x._ghost, view.held, m.from === 'deck', j * 35));

      } else if (m.k === 'swap') {
        if (m.p === me && !reducedMotion) {
          cell.animate([{ transform: 'scale(.82)' }, { transform: 'scale(1.06)' }, { transform: 'none' }], { duration: 320, easing: 'ease-out' });
        } else if (m.p !== me) {
          fly(m.from === 'discard' ? disc : held, cell, view.grids[m.p][m.i].v, false);
          setTimeout(() => highlight(cell), 500);
        }
        fly(cell, disc, m.out, !m.outUp, 90);
        sfx.whoosh();
      } else if (m.k === 'drop') {
        fly(m.p === me && cell ? cell : held, disc, m.v, false);
        sfx.whoosh();
      } else if (m.k === 'flip' && m.p !== me && view.phase === 'play') {
        highlight(cell);
      }
    }
  }

  function poofColumns(cleared) {
    for (const { p, col } of cleared) {
      const cells = [col, col + 4, col + 8].map(j => gridEl(p)._cells[j]);
      const r1 = cells[0].getBoundingClientRect(), r3 = cells[2].getBoundingClientRect();
      const v = view && view.grids[p] ? view.grids[p][col].v : null;
      fx.burst((r1.left + r1.right) / 2, (r1.top + r3.bottom) / 2, 110, v !== null ? [colorOf(v)] : []);
      [col, col + 4, col + 8].forEach(j => pendingGone.delete(p + ':' + j));
    }
    sfx.clear();
    render();
  }

  function sounds(a, b, fresh) {
    const count = (v, f) => v.grids.reduce((s, g) => s + g.filter(f).length, 0);
    if (!a.grids.length || a.round !== b.round) return;
    if (a.phase !== b.phase && (b.phase === 'roundEnd' || b.phase === 'gameOver')) return sfx.end();
    if (!fresh.some(m => m.k === 'swap') && count(b, c => c.up) > count(a, c => c.up)) sfx.flip();
    if (b.phase === 'play' && b.turn === me && (a.turn !== me || a.phase !== 'play')) setTimeout(sfx.turn, 350);
  }

  /* ---------- round results ---------- */
  let resultKey = null, resultToken = 0, resultTimer = null, resultShown = true;
  const shownTotal = (v, p) => (!resultShown && v.last ? v.totals[p] - v.last.scores[p] : v.totals[p]);
  function updateResult(v, fromPlay) {
    const over = v.phase === 'roundEnd' || v.phase === 'gameOver';
    const wrap = $('#resultwrap');
    if (!over) {
      if (resultKey) { resultKey = null; resultToken++; clearTimeout(resultTimer); wrap.classList.add('hidden'); }
      resultShown = true;
      return;
    }
    const key = v.phase + ':' + v.round;
    if (resultKey === key) return;
    resultKey = key;
    resultShown = !fromPlay;
    const token = ++resultToken;
    if (fromPlay) resultTimer = setTimeout(() => token === resultToken && showResult(token, true), 1900);
    else showResult(token, false);
  }
  function countUp(el, from, to, dur, token, tick) {
    return new Promise(res => {
      const t0 = performance.now(); let last = from;
      const step = now => {
        if (token !== resultToken) return res();
        const t = Math.min(1, (now - t0) / dur), val = Math.round(from + (to - from) * (1 - Math.pow(1 - t, 3)));
        el.textContent = val;
        if (tick && val !== last) { last = val; sfx.tick(); }
        t < 1 ? requestAnimationFrame(step) : res();
      };
      requestAnimationFrame(step);
    });
  }
  async function showResult(token, anim) {
    const v = view, r = v.last, op = 1 - me, over = v.phase === 'gameOver';
    const wrap = $('#resultwrap'), el = $('#result');
    wrap.classList.remove('hidden', 'peek');
    el.innerHTML = `<div class="medal"></div><h3></h3><div class="caption"></div>
      <div class="rgrid"><span></span><span class="h">Round</span><span class="h">Total</span></div>
      <div class="rfoot wait"><button class="btn" id="nextbtn"></button><button class="btn ghost" id="peekbtn">👀 Board</button></div>`;
    el.style.animation = 'none'; void el.offsetWidth; el.style.animation = '';
    el.querySelector('h3').textContent = over ? 'Game over!' : `Round ${v.round} finished`;
    const grid = el.querySelector('.rgrid'), rows = {};
    for (const p of [me, op]) {
      const nm = document.createElement('span'); nm.className = 'nm';
      nm.textContent = who(p) + ' ';
      if (r.finisher === p) { const s = document.createElement('small'); s.textContent = '🏁 ended'; nm.appendChild(s); }
      const sc = document.createElement('span'); sc.className = 'sc';
      sc.innerHTML = '<b>0</b><em class="stamp">×2</em>';
      const tot = document.createElement('span'); tot.className = 'tot';
      tot.textContent = v.totals[p] - r.scores[p];
      grid.append(nm, sc, tot);
      rows[p] = { nm, num: sc.querySelector('b'), stamp: sc.querySelector('.stamp'), tot };
    }
    const btn = el.querySelector('#nextbtn');
    btn.textContent = over ? 'Play again' : 'Next round';
    btn.onclick = () => send({ type: over ? 'newGame' : 'nextRound' });
    el.querySelector('#peekbtn').onclick = () => wrap.classList.add('peek');

    const alive = () => token === resultToken;
    if (anim) {
      await Promise.all([me, op].map(p => countUp(rows[p].num, 0, r.raw[p], 900, token, p === me)));
      if (!alive()) return;
      if (r.doubled !== null) {
        await wait(350); if (!alive()) return;
        rows[r.doubled].stamp.classList.add('slam');
        await wait(300); if (!alive()) return;
        sfx.stamp(); rows[r.doubled].num.textContent = r.scores[r.doubled];
        el.animate([{ transform: 'translate(0,0)' }, { transform: 'translate(-6px,3px)' }, { transform: 'translate(5px,-2px)' },
          { transform: 'translate(0,0)' }], { duration: 250 });
        await wait(500); if (!alive()) return;
      }
      await Promise.all([me, op].map(p => countUp(rows[p].tot, v.totals[p] - r.scores[p], v.totals[p], 800, token, false)));
      if (!alive()) return;
      await wait(250); if (!alive()) return;
    } else {
      for (const p of [me, op]) { rows[p].num.textContent = r.scores[p]; rows[p].tot.textContent = v.totals[p]; }
      if (r.doubled !== null) rows[r.doubled].stamp.style.cssText = 'opacity:1;transform:none';
    }
    if (over) {
      const [a, b] = [v.totals[me], v.totals[op]];
      const medal = el.querySelector('.medal'), cap = el.querySelector('.caption');
      medal.classList.add('show');
      if (a === b) {
        medal.textContent = '🤝'; el.querySelector('h3').textContent = "It's a tie!";
      } else {
        const winner = a < b ? me : op, loser = 1 - winner;
        medal.textContent = '🏆';
        el.querySelector('h3').textContent = who(winner) === 'You' ? 'You win!' : `${v.names[winner]} wins!`;
        cap.textContent = `🥄 Wooden spoon for ${who(loser) === 'You' ? 'you' : v.names[loser]}`;
        rows[winner].nm.prepend('🏆 '); rows[loser].nm.prepend('🥄 ');
        if (anim) {
          if (winner === me) { sfx.win(); fx.rain(3500); } else { sfx.sad(); fx.rain(1200); }
        }
      }
    } else {
      const better = r.scores[me] === r.scores[op] ? 'Same score this round'
        : r.scores[me] < r.scores[op] ? `${who(me)} won this round` + (spectating ? '' : ' 🎉') : `${v.names[op]} won this round`;
      el.querySelector('.caption').textContent = better;
      if (anim && r.scores[me] < r.scores[op]) fx.burst(innerWidth / 2, innerHeight / 3, 70);
    }
    el.querySelector('.rfoot').classList.remove('wait');
    resultShown = true;
    render();
  }

  function renderScores() {
    const v = view, t = $('#scores'); if (!v) return;
    const op = 1 - me;
    t.innerHTML = '';
    const head = t.createTHead().insertRow();
    ['#', who(me), v.names[op]].forEach(x => { const th = document.createElement('th'); th.textContent = x; head.appendChild(th); });
    const body = t.createTBody();
    const showUpTo = resultShown ? v.history.length : v.history.length - 1;
    v.history.slice(0, showUpTo).forEach((h, i) => {
      const tr = body.insertRow();
      [i + 1, h.scores[me], h.scores[op]].forEach((x, j) => {
        const td = tr.insertCell(); td.textContent = x;
        if (j > 0 && h.doubled === (j === 1 ? me : op)) { td.className = 'x2'; td.title = 'Doubled'; td.textContent = x + ' ×2'; }
      });
    });
    if (!showUpTo) { const td = body.insertRow().insertCell(); td.colSpan = 3; td.textContent = 'No rounds played yet'; }
    const foot = t.createTFoot().insertRow();
    ['Total', shownTotal(v, me), shownTotal(v, op)].forEach(x => { foot.insertCell().textContent = x; });
  }

  function showGame() {
    $('#start').classList.add('hidden');
    $('#game').classList.remove('hidden');
  }

  /* ---------- setup ---------- */
  function myName() { return ($('#name').value.trim() || 'Player').slice(0, 16); }
  function init() {
    buildGrid($('#mygrid'), onMyCard);
    buildGrid($('#oppgrid'));
    [['#deck', () => send({ type: 'drawDeck' })],
     ['#discard', () => send({ type: 'takeDiscard' })],
     ['#held', null]].forEach(([sel, fn]) => {
      const c = cardEl(); $(sel).appendChild(c); $(sel)._c = c;
      if (fn) c.addEventListener('click', fn);
    });
    EMOJIS.forEach(e => {
      const b = document.createElement('button'); b.type = 'button'; b.textContent = e;
      b.onclick = () => sendEmoji(e); $('#emojis').appendChild(b);
    });
    $('#pokebtn').onclick = sendPoke;
    $('#roomchip').onclick = () => {
      (navigator.clipboard ? navigator.clipboard.writeText(code) : Promise.reject())
        .then(() => toast(`Code ${code} copied`), () => toast(`Room code: ${code}`));
    };
    $('#showres').onclick = () => $('#resultwrap').classList.remove('peek');
    $('#chatform').onsubmit = ev => { ev.preventDefault(); sendChat($('#chatin').value); $('#chatin').value = ''; };
    document.addEventListener('keydown', e => {
      if ($('#game').classList.contains('hidden') || e.ctrlKey || e.metaKey) return;
      const t = document.activeElement;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA')) {
        if (e.key === 'Escape' && t.id === 'chatin') t.blur();
        return;
      }
      if (e.key.length !== 1 && e.key !== 'Dead') return;
      // space draws a new card from the deck, or continues from the round result (never re-clicks a focused button)
      if (e.key === ' ') {
        e.preventDefault();
        if (e.repeat || !view) return;
        const next = $('#nextbtn');
        if (next && !$('#resultwrap').classList.contains('hidden') && !next.closest('.rfoot').classList.contains('wait')) next.click();
        else if (view.phase === 'play' && view.turn === me && view.step === 'choose') send({ type: 'drawDeck' });
        return;
      }
      if (innerWidth < 900) { $('#side').classList.add('open'); unread = 0; renderChat(); }
      $('#chatin').focus();
    });
    $('#sidebtn').onclick = () => { $('#side').classList.add('open'); unread = 0; renderChat(); };
    $('#sideclose').onclick = () => $('#side').classList.remove('open');
    $('#mutebtn').textContent = muted ? '🔇' : '🔊';
    $('#mutebtn').onclick = () => { muted = !muted; store.set('nimbo-muted', muted); $('#mutebtn').textContent = muted ? '🔇' : '🔊'; };
    $('#leave').onclick = () => {
      if (!confirm('Leave this game?')) return;
      store.del(role === 'host' ? 'nimbo-host' : 'nimbo-guest');
      active.del();
      // tell the host, so a spectator (or the bot) can take the seat right away
      if (role === 'guest' && conn && conn.open) conn.send({ t: 'leave' });
      setTimeout(() => { if (peer) peer.destroy(); location.href = location.pathname; }, 300);
    };

    $('#name').value = store.get('nimbo-name') || '';
    $('#name').oninput = () => store.set('nimbo-name', $('#name').value.trim());
    const needName = () => {
      if ($('#name').value.trim()) return false;
      $('#starterr').textContent = 'Please enter your name first.'; $('#name').focus(); return true;
    };
    const peerOk = () => {
      if (window.Peer) return true;
      $('#starterr').textContent = 'Could not load the network library.'; return false;
    };
    $('#create').onclick = () => {
      if (role || needName() || !peerOk()) return;
      store.del('nimbo-host'); hostGame(null);
    };
    const saved = store.get('nimbo-host');
    if (saved && saved.state && saved.state.phase !== 'lobby') {
      const r = $('#resume');
      r.textContent = `Resume game ${saved.code} vs ${saved.state.names[1]}`;
      r.classList.remove('hidden');
      r.onclick = () => { if (!role && peerOk()) hostGame(saved); };
    }
    const doJoin = () => {
      const c = $('#joincode').value.trim().toUpperCase();
      if (role || needName() || !peerOk()) return;
      if (!/^[A-Z0-9]{4}$/.test(c)) { $('#starterr').textContent = 'The code has 4 characters.'; return; }
      joinGame(c);
    };
    $('#join').onclick = doJoin;
    $('#joincode').onkeydown = e => { if (e.key === 'Enter') doJoin(); };
    const q = new URLSearchParams(location.search).get('room');
    const g = store.get('nimbo-guest');
    if (q) $('#joincode').value = q.toUpperCase().slice(0, 4);
    else if (g) $('#joincode').value = g.code;

    // reload: continue the running game in the same role
    const was = active.get();
    if (was === 'host' && saved && saved.state && peerOk()) hostGame(saved);
    else if (was === 'guest' && g && peerOk()) joinGame(g.code, true);
    else active.del();
    // free the peer id right away so the reloaded page can reclaim it
    addEventListener('pagehide', () => { if (peer && !peer.destroyed) peer.destroy(); });
    addEventListener('pageshow', e => { if (e.persisted && role) location.reload(); });
  }
  init();
})();
</script>
</body>
</html>
